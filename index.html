<!DOCTYPE html>
<html>
<head>
  <title>Health Chatbot</title>
  <style>
    body { font-family: Arial; max-width: 600px; margin: 50px auto; }
    #chatbox { border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
    .user { text-align: right; color: blue; margin: 5px 0; }
    .bot { text-align: left; color: green; margin: 5px 0; }
    input { width: 80%; padding: 8px; }
    button { padding: 8px 15px; background: #007bff; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <h2>🏥 Health Chatbot</h2>
  <div id="chatbox"></div>
  <input id="userInput" type="text" placeholder="Type your message..." onkeypress="if(event.key==='Enter') sendMsg()"/>
  <button onclick="sendMsg()">Send</button>

  <script>
    function sendMsg() {
      const input = document.getElementById('userInput');
      const msg = input.value.trim();
      if (!msg) return;

      const chatbox = document.getElementById('chatbox');
      chatbox.innerHTML += `<div class="user">You: ${msg}</div>`;
      input.value = '';

      fetch('/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({message: msg})
      })
      .then(res => res.json())
      .then(data => {
        chatbox.innerHTML += `<div class="bot">Bot: ${data.response}</div>`;
        chatbox.scrollTop = chatbox.scrollHeight;
      });
    }
  </script>
</body>
</html>
